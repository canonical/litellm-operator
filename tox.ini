[tox]
no_package = True
skip_missing_interpreters = True
env_list = format, lint, unit
requires =
    tox-uv

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
scripts_path = {tox_root}/scripts
all_path = {[vars]src_path} {[vars]tests_path} {[vars]scripts_path}

[testenv]
runner = uv-venv-lock-runner
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}:{[vars]scripts_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_PATH
    LITELLM_IMAGE
    KEEP_MODELS
    LITELLM_TEST_UPSTREAM_URL
    LITELLM_TEST_UPSTREAM_MODEL
    MULTINODE

[testenv:format]
description = Apply coding style standards to code
dependency_groups = lint
commands =
    ruff format {[vars]all_path}
    ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
dependency_groups = lint
commands =
    ruff check {[vars]all_path}
    ruff format --check {[vars]all_path}

[testenv:unit]
description = Run unit tests
dependency_groups = unit
commands =
    pytest {[vars]tests_path}/unit {posargs:-v}

[testenv:integration]
description = Run integration tests (needs a bootstrapped Juju controller on a K8s cloud)
dependency_groups = integration
commands =
    pytest {[vars]tests_path}/integration {posargs:-v -x --tb=short}

[testenv:check-requirements]
description = Check that requirements/ holds one requirements.md per feature and nothing else
commands =
    python3 {[vars]scripts_path}/check_requirements.py

[testenv:adopt-requirements]
description = Move Spec Kit's specs/NNN-slug/spec.md to requirements/NNN-slug/requirements.md
commands =
    python3 {[vars]scripts_path}/adopt_requirements.py {posargs}
