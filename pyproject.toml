[project]
name = "litellm-k8s-charm"
version = "0.1.0"
requires-python = ">=3.12"
description = "Kubernetes charm for the LiteLLM proxy"
license = "Apache-2.0"
authors = [{ name = "Canonical Ltd." }]
dependencies = [
    "ops ~= 3.0",
    "pyyaml",
    # Required by the vendored charms.traefik_k8s.v2.ingress library.
    "pydantic ~= 2.0",
]

[dependency-groups]
lint = [
    "ruff",
]
unit = [
    "pytest",
    "ops[testing] ~= 3.0",
]
integration = [
    "pytest",
    "jubilant ~= 1.0",
    "pyyaml",
]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["lib"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "adopt_requirements",
    "charm",
    "check_requirements",
    "conftest",
    "defaults",
    "helpers",
    "litellm_config",
    "workload",
]

[tool.pytest.ini_options]
pythonpath = ["src", "lib", "scripts"]
