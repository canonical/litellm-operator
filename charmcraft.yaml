name: litellm
type: charm
title: LiteLLM
summary: LiteLLM proxy, an OpenAI-compatible gateway to many LLM providers, on Kubernetes.

description: |
  LiteLLM is a proxy that gives applications one OpenAI-compatible endpoint
  for more than 100 LLM providers and self-hosted model servers, with keys,
  budgets, retries and fallbacks.

  This Kubernetes charm runs the upstream LiteLLM image. Models are
  configured with charm options, and the master key and upstream API keys
  are read from a Juju user secret, so they never appear in `juju config`.

  LiteLLM is MIT licensed by BerriAI, except its `enterprise/` directory.
  This charm is an independent packaging effort, licensed Apache-2.0.

links:
  source:
    - https://github.com/canonical/litellm-operator
    - https://github.com/BerriAI/litellm
  website:
    - https://www.litellm.ai/
  issues:
    - https://github.com/canonical/litellm-operator/issues

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - k8s-api
  - juju >= 3.6

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

charm-libs:
  - lib: traefik_k8s.ingress
    version: "2"

containers:
  litellm:
    resource: litellm-image

resources:
  litellm-image:
    type: oci-image
    description: OCI image of the LiteLLM proxy. Defaults to the upstream non-root image.
    upstream-source: ghcr.io/berriai/litellm-non_root:v1.108.3

requires:
  ingress:
    interface: ingress
    limit: 1
    optional: true

config:
  options:
    credentials-secret:
      type: secret
      description: >
        A Juju user secret holding `master-key`, the key clients call the
        proxy with, which must start with `sk-`, and any upstream API keys
        under names of your choice, such as `openai`. Model entries refer to
        upstream keys by name. Create it with
        `juju add-secret litellm-credentials master-key=sk-... openai=sk-...`,
        grant it with `juju grant-secret litellm-credentials litellm`, and set
        this option to the secret URI.
    models:
      type: string
      default: ""
      description: >
        Models as a YAML list. Each entry has `name`, the name clients use;
        `model`, the LiteLLM provider and model such as `openai/gpt-4o`; and
        optionally `api-base`, the upstream address; `credential`, the key in
        `credentials-secret` holding its API key; and `input-cost-per-token`
        and `output-cost-per-token`, used to record spend.
    model-list:
      type: string
      default: ""
      description: >
        Additional raw LiteLLM `model_list` entries as a YAML list, served
        together with `models`. Refer to keys in `credentials-secret` as
        `os.environ/LITELLM_CREDENTIAL_<KEY>`, upper-cased with `-` as `_`.
    model-cost-map-url:
      type: string
      default: ""
      description: >
        Address of a full price map in LiteLLM's format, loaded at startup
        instead of the map bundled in the image. If it cannot be loaded or is
        rejected, the bundled map is used and the unit status says so.
    routing-strategy:
      type: string
      default: simple-shuffle
      description: >
        How requests are spread across entries with the same name: one of
        simple-shuffle, least-busy, usage-based-routing, latency-based-routing,
        cost-based-routing or usage-based-routing-v2.
    num-retries:
      type: int
      description: Retries for a failed upstream request. Unset uses LiteLLM's default.
    request-timeout:
      type: int
      description: Seconds before an upstream request fails. Unset uses LiteLLM's default.
    fallbacks:
      type: string
      default: ""
      description: >
        Models to try when a model fails, as a YAML list of
        `{model: [fallback, ...]}`, for example `[{gpt-4o: [local]}]`.
    log-level:
      type: string
      default: INFO
      description: Workload log level, one of DEBUG, INFO, WARNING, ERROR or CRITICAL.
    log-request-content:
      type: boolean
      default: false
      description: >
        Allow prompts and completions to be logged. Off by default, which
        redacts them from LiteLLM's logging.
    drop-params:
      type: boolean
      default: false
      description: Drop request parameters an upstream does not support instead of failing.
    max-request-size-mb:
      type: int
      default: 0
      description: Largest request body accepted, in megabytes. 0 means no limit.
    serve-without-database:
      type: boolean
      default: false
      description: >
        Keep serving requests made with the master key while the related
        database is unavailable.
    spend-logs:
      type: boolean
      default: true
      description: Write a spend log entry for each request to the database.
    litellm-settings:
      type: string
      default: ""
      description: >
        Additional LiteLLM `litellm_settings` as a YAML mapping. Named options
        win over it. Settings the charm manages are refused.
    router-settings:
      type: string
      default: ""
      description: >
        Additional LiteLLM `router_settings` as a YAML mapping. Named options
        win over it. Settings the charm manages are refused.
    extra-env:
      type: string
      default: ""
      description: >
        Additional environment variables for LiteLLM, as KEY=VALUE lines.
        Variables the charm manages are refused. Put secrets in
        credentials-secret instead.
